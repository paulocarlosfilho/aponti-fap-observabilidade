name: "Terraform LocalStack CI - aponti-desafio6"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  terraform-deploy:
    name: "Terraform Init, Plan & Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Sobe o LocalStack de forma limpa via Docker (sem travar por licença)
      - name: Start LocalStack via Docker
        run: |
          docker run -d --name localstack -p 4566:4566 localstack/localstack
          echo "Aguardando o LocalStack iniciar na porta 4566..."
          until curl -s http://localhost:4566/_localstack/health; do
            sleep 2
          done
        shell: bash

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: terraform